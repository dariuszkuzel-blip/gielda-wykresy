<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giełda — wykresy Dariusza k</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="tlo"></div>
  <main class="app">
    <header>
      <p class="nadrzedny">GPW · NYSE · Nasdaq</p>
      <h1>Giełda — wykresy Dariusza k</h1>
      <p class="opis">Wybierz giełdę, znajdź ticker i przełącz okres. Wykres pochodzi z TradingView.</p>
    </header>

    <section class="sterowanie">
      <div class="gieldy" role="tablist" aria-label="Giełda">
        <button type="button" class="aktywna" data-gielda="GPW">GPW</button>
        <button type="button" data-gielda="NYSE">NYSE</button>
        <button type="button" data-gielda="NASDAQ">Nasdaq</button>
      </div>

      <label class="szukaj">
        <span>Spółka lub ticker</span>
        <input id="szukaj" type="search" placeholder="Np. CD Projekt, PKO, AAPL" autocomplete="off">
        <ul id="podpowiedzi" hidden></ul>
      </label>

      <div class="okresy" aria-label="Okres">
        <button type="button" data-okres="5">1D</button>
        <button type="button" data-okres="15">5D</button>
        <button type="button" class="aktywna" data-okres="D">1M</button>
        <button type="button" data-okres="D3">3M</button>
        <button type="button" data-okres="D6">6M</button>
        <button type="button" data-okres="W">1R</button>
        <button type="button" data-okres="M">5L</button>
        <button type="button" data-okres="MMAX">Max</button>
      </div>
    </section>

    <section class="panel">
      <div class="naglowek-spolki">
        <div>
          <h2 id="tytul">Wybierz spółkę</h2>
          <p id="podtytul">Wyszukaj ticker albo wybierz z listy.</p>
        </div>
      </div>
      <p id="status" class="status"></p>
      <div class="wykres-wrap">
        <div id="tv"></div>
      </div>
    </section>
  </main>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script src="tickers.js"></script>
  <script src="app.js"></script>
</body>
</html>
